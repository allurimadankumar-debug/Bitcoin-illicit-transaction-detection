services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATASET_SOURCE: ${DATASET_SOURCE:-auto}
      AUTO_TRAIN_DEMO: ${AUTO_TRAIN_DEMO:-true}
      CALIBRATE_MODEL: ${CALIBRATE_MODEL:-true}
      RANDOM_STATE: ${RANDOM_STATE:-42}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ENABLE_LIVE_LOOKUP: ${ENABLE_LIVE_LOOKUP:-false}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend
